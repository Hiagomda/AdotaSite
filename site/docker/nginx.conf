# Cache do painel "ao vivo": a API só é chamada uma vez por minuto, por mais visitas que o site tenha.
proxy_cache_path /var/cache/nginx/ao-vivo levels=1 keys_zone=aovivo:1m max_size=10m inactive=1d use_temp_path=off;
proxy_cache_path /var/cache/nginx/fotos levels=1:2 keys_zone=fotos:4m max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    # A API e as fotos do app são outro recurso do Coolify, então vão pelo endereço público.
    # O nome resolve na hora do pedido (não na subida): se a API cair, o site continua no ar.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_host api.eguaadota.com.br;
    set $fotos_host img.eguaadota.com.br;

    # Dados públicos do app para a seção "Ao vivo" (só bicho, bairro e foto), pedidos daqui para
    # a página só falar com o próprio site.
    location = /ao-vivo.json {
        limit_except GET { deny all; }
        proxy_pass https://$api_host/stats/live;
        proxy_ssl_server_name on;
        proxy_ssl_name $api_host;
        proxy_set_header Host $api_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache aovivo;
        proxy_cache_key ao-vivo;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=30";
    }

    # Fotos da seção "Ao vivo". Os endereços do servidor de fotos são assinados pela API, então só
    # abre o que a API mandou.
    location /fotos/ {
        limit_except GET { deny all; }
        rewrite ^/fotos/(.*)$ /$1 break;
        proxy_pass https://$fotos_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $fotos_host;
        proxy_set_header Host $fotos_host;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_cache fotos;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
    }

    location = /egua-adota.apk {
        alias /apk/egua-adota.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="egua-adota.apk"';
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        root /apk;
        try_files /version.json @bundled_version;
    }

    location @bundled_version {
        default_type application/json;
        add_header Cache-Control "no-store";
        root /usr/share/nginx/html;
        try_files /version.json =404;
    }

    # HTML sempre revalidado: depois de um deploy o navegador não mostra a página antiga do cache
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    location = /egua-adota.apk {
        alias /apk/egua-adota.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="egua-adota.apk"';
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        root /apk;
        try_files /version.json @bundled_version;
    }

    location @bundled_version {
        default_type application/json;
        add_header Cache-Control "no-store";
        root /usr/share/nginx/html;
        try_files /version.json =404;
    }

    # HTML sempre revalidado: depois de um deploy o navegador não mostra a página antiga do cache
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
